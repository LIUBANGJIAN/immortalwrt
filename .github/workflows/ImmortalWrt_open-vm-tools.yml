name: Build_ImmortalWrt_V27_Fix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: 极限清理空间 (解决静默失败)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        # 挂载大容量分区
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV
        df -h

    - name: 更新 Feeds 与强制覆盖源
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        ./scripts/feeds update -a
        # 强制删除官方库冲突项
        for pkg in lucky netbird rtp2httpd frpc frps turboacc; do
          find feeds/ -name "$pkg" -type d -exec rm -rf {} + || true
        done
        git clone https://github.com/chenmozhijin/turboacc package/turboacc
        ./scripts/feeds install -a

    - name: 固件配置 (补全驱动/插件/时区)
      run: |
        cd openwrt
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
        
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=900" >> .config

        # 注入驱动
        for drv in autocore automount block-mount fdisk fstools grub2-bios-setup mkf2fs mtd partx-utils \
        kmod-e1000e kmod-igc kmod-r8125 kmod-r8126 kmod-r8168 kmod-vmxnet3 kmod-8139cp kmod-8139too \
        kmod-i40e kmod-igb kmod-igbvf kmod-ixgbe kmod-ixgbevf kmod-pcnet32 kmod-r8101 kmod-tulip \
        kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-e1000 kmod-tg3 kmod-forcedeth kmod-dwmac-intel \
        open-vm-tools kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 \
        kmod-usb-net-rtl8152-vendor kmod-usb-hid i915-firmware-dmc kmod-drm-i915 kmod-fs-f2fs \
        kmod-fs-vfat kmod-nf-nathelper kmod-nf-nathelper-extra kmod-nft-offload; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # 注入插件
        for app in luci-compat luci-i18n-base-zh-cn luci-app-lucky netbird luci-app-rtp2httpd rtp2httpd \
        luci-app-turboacc luci-i18n-turboacc-zh-cn luci-app-passwall luci-app-ttyd \
        luci-app-frps luci-app-frpc luci-app-netdata wireguard luci-app-wireguard \
        luci-proto-wireguard luci-app-upnp iperf3 iperf nano tcpdump pv iftop htop; do
          echo "CONFIG_PACKAGE_$app=y" >> .config
        done

        make defconfig
        make download -j16

    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

    - name: 整理镜像 (增加校验)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        mkdir -p /tmp/upload/
        # 搜索生成的固件
        FILE_COUNT=$(find bin/targets/x86/64/ -name "*squashfs*" | wc -l)
        if [ $FILE_COUNT -eq 0 ]; then
          echo "错误：未找到生成的 Squashfs 镜像，请检查编译日志中是否有错误！"
          exit 1
        fi
        find bin/targets/x86/64/ -name "*combined*squashfs*.img.gz" -exec cp {} /tmp/upload/ \;
        cd /tmp/upload/
        [ -f *efi.img.gz ] && mv *efi.img.gz "ImmortalWrt-x86-64-EFI-Squashfs.img.gz" || true
        find . -name "*combined*squashfs.img.gz" ! -name "*EFI*" -exec mv {} "ImmortalWrt-x86-64-Legacy-Squashfs.img.gz" \; 2>/dev/null || true

    - name: 发布 Release (保留3个)
      if: steps.compile.outputs.status == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: "Build-${{ github.run_id }}"
        release_name: "ImmortalWrt-${{ env.BUILD_TIME }}"
        overwrite: true
        file_glob: true

    - name: 滚动清理
      if: steps.compile.outputs.status == 'success'
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

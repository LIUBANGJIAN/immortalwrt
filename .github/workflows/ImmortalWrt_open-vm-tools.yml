name: Build_ImmortalWrt_V21_Final

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 磁盘与环境准备
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential gawk git scons unzip gettext python3 nano
        sudo snap install go --classic

    - name: 更新 Feeds 与集成 TurboACC
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        git clone https://github.com/chenmozhijin/turboacc package/turboacc
        find feeds/packages feeds/luci -name "*netbird*" -o -name "*rtp2httpd*" | xargs rm -rf
        ./scripts/feeds install -a

    - name: 固件底层与时区配置
      run: |
        cd openwrt
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
        
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=900" >> .config

    - name: 注入全量驱动与插件 (V21 修正版)
      run: |
        cd openwrt
        # 1. 驱动全量补齐 (你提供的清单)
        for drv in autocore automount block-mount fdisk fstools grub2-bios-setup mkf2fs mtd partx-utils \
        kmod-e1000e kmod-igc kmod-r8125 kmod-r8126 kmod-r8168 kmod-vmxnet3 kmod-8139cp kmod-8139too \
        kmod-i40e kmod-igb kmod-igbvf kmod-igc kmod-ixgbe kmod-ixgbevf kmod-pcnet32 kmod-r8101 \
        kmod-tulip kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-e1000 kmod-tg3 kmod-forcedeth \
        kmod-dwmac-intel open-vm-tools kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 \
        kmod-usb-net-rtl8150 kmod-usb-net-rtl8152-vendor kmod-usb-hid i915-firmware-dmc kmod-drm-i915 \
        kmod-fs-f2fs kmod-fs-vfat kmod-nf-nathelper kmod-nf-nathelper-extra kmod-nft-offload; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # 2. 应用插件 (修正缺失项)
        for app in luci-compat luci-i18n-base-zh-cn luci-app-lucky netbird luci-app-rtp2httpd \
        rtp2httpd luci-app-turboacc luci-i18n-turboacc-zh-cn luci-app-passwall luci-app-ttyd \
        luci-app-frps luci-app-frpc luci-app-netdata wireguard luci-app-wireguard luci-proto-wireguard \
        iperf3 iperf nano tcpdump pv iftop htop; do
          echo "CONFIG_PACKAGE_$app=y" >> .config
        done

        make defconfig
        # 二次检查：确保关键包没被剔除
        for app in netbird wireguard pv iftop; do
          grep -q "CONFIG_PACKAGE_$app=y" .config || echo "CONFIG_PACKAGE_$app=y" >> .config
        done
        make download -j16

    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
        echo "OS_VER=$(grep "DISTRIB_REVISION" package/base-files/files/etc/openwrt_release | cut -d"'" -f2)" >> $GITHUB_ENV

    - name: 整理镜像 (只保留 Squashfs)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        mkdir -p /tmp/upload/
        # 只筛选包含 squashfs 和 combined 的镜像
        find bin/targets/x86/64/ -name "*combined-squashfs*.img.gz" -exec cp {} /tmp/upload/ \;
        cd /tmp/upload/
        for f in *efi.img.gz; do mv "$f" "ImmortalWrt-x86_64-EFI-Squashfs.img.gz" 2>/dev/null || true; done
        for f in *.img.gz; do [[ "$f" != *"EFI"* ]] && mv "$f" "ImmortalWrt-x86_64-Legacy-Squashfs.img.gz" 2>/dev/null || true; done

    - name: 发布 Release (保留最后3个)
      if: steps.compile.outputs.status == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: Release-${{ github.run_id }}
        release_name: "ImmortalWrt-${{ env.BUILD_TIME }}"
        body: |
          ### 编译信息
          - **编译时间**: ${{ env.BUILD_TIME }}
          - **源码版本**: ${{ github.event.inputs.branch }} / ${{ env.OS_VER }}
          - **镜像类型**: Squashfs (仅保留)
          - **集成插件**: Lucky, Netbird, TurboACC, Passwall, Netdata, Wireguard, FRP, iperf, nano, etc.
        overwrite: true
        file_glob: true

    - name: 滚动清理 (只保留最后3个 Release)
      if: steps.compile.outputs.status == 'success'
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

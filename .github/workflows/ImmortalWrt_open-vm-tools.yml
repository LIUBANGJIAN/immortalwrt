name: Build_ImmortalWrt_V38_Path_Fixed

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: 极限空间清理
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV

    - name: 更新 Feeds 并精准清理冲突插件
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        
        # 1. 注入源 (将自定义源放在前面以获得高优先级)
        sed -i '1i src-git lucky https://github.com/gdy666/luci-app-lucky.git' ./feeds.conf.default
        sed -i '1i src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git' ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        
        # 2. 【核心改进】只删除插件，千万不要删除 lang/golang
        # 删除 feeds/packages 里的旧版插件，确保使用自定义源里的新版
        find feeds/packages/ -name "netbird" -type d -exec rm -rf {} + || true
        find feeds/packages/ -name "frpc" -type d -exec rm -rf {} + || true
        find feeds/packages/ -name "frps" -type d -exec rm -rf {} + || true
        
        ./scripts/feeds install -a

    - name: 固件配置 (两步强力注入)
      run: |
        cd openwrt
        # 基础架构与分区
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config

        # 核心：选中 golang 和网络基础包
        echo "CONFIG_PACKAGE_golang=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_ca-bundle=y" >> .config

        # 第一次生成配置
        make defconfig

        # --- 【第二次暴力修正】 ---
        # 针对消失的插件，强行改写 .config 结果
        for plugin in netbird luci-app-lucky luci-app-frps luci-app-frpc luci-app-turboacc pv iftop iperf3; do
          sed -i "s/# CONFIG_PACKAGE_$plugin is not set/CONFIG_PACKAGE_$plugin=y/g" .config
          echo "CONFIG_PACKAGE_$plugin=y" >> .config
        done
        
        # 补齐 TurboACC 依赖
        echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config

        # 最终确认配置
        make defconfig
        make download -j16

    - name: 编译
      run: |
        cd openwrt
        echo "--- 检查配置锁定状态 ---"
        grep -E "CONFIG_PACKAGE_(netbird|luci-app-lucky|luci-app-frpc|luci-app-turboacc)" .config || true
        make -j$(nproc) || make -j1 V=s || exit 1

    - name: 整理发布
      run: |
        cd openwrt
        mkdir -p /tmp/upload/
        find bin/targets/x86/64/ -name "*.img.gz" -exec cp {} /tmp/upload/ \;
        
    - name: Upload Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: "Build-V38-${{ github.run_id }}"
        release_name: "ImmortalWrt-V38-Fixed"
        overwrite: true
        file_glob: true

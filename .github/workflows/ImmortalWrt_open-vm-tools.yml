name: Build_ImmortalWrt_Ultimate_v10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支 (例如 openwrt-24.10)'
        required: true
        default: 'openwrt-24.10'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  TARGET_BRANCH: ${{ github.event.inputs.branch }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 极致空间清理与分区扩容
      run: |
        # 1. 删除系统冗余
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        
        # 2. 清理 Docker 镜像 (腾出约 9GB)
        sudo docker image prune -a -f
        
        # 3. 【核心修复】将编译目录映射到 /mnt 磁盘 (解决空间不足导致的编译中断)
        sudo mkdir -p /mnt/openwrt
        sudo chown $USER:$USER /mnt/openwrt
        ln -s /mnt/openwrt $(pwd)/openwrt
        
        sudo apt-get clean
        df -h

    - name: 安装编译依赖与最新Go
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        # Netbird 必须使用最新 Go
        sudo snap install go --classic

    - name: 克隆源码并智能处理源
      run: |
        git clone $REPO_URL -b ${{ env.TARGET_BRANCH }} openwrt
        cd openwrt
        # 添加自定义源
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        echo "src-git taskplan https://github.com/sirpdboy/luci-app-taskplan.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        
        # 【智能查重】自动删除官方源中与自定义源重名的文件夹
        echo "开始检测并覆盖冲突插件..."
        for cf in lucky small netbird_custom rtp2httpd taskplan; do
          if [ -d "feeds/$cf" ]; then
            for pkg in $(ls feeds/$cf); do
              find feeds/packages feeds/luci -name "$pkg" -type d -exec rm -rf {} + 2>/dev/null || true
            done
          fi
        done
        
        # 强制克隆最新 open-vm-tools 源码
        git clone https://github.com/vmware/open-vm-tools.git package/open-vm-tools-latest

        ./scripts/feeds install -a -f

    - name: 固件个性化设置
      run: |
        cd openwrt
        # 时区/语言
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
        # 强制清理 LuCI 索引缓存 (解决 taskplan 菜单不显示问题)
        mkdir -p files/etc/uci-defaults
        echo "rm -f /tmp/luci-indexcache" > files/etc/uci-defaults/99-clean-cache

    - name: 生成编译配置
      run: |
        cd openwrt
        # 1. 基础架构
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # 2. 物理机/虚拟机全量驱动与初始化包
        for drv in autocore automount base-files block-mount fdisk firewall4 fstools grub2-bios-setup \
        i915-firmware-dmc kmod-8139cp kmod-8139too kmod-e1000e kmod-fs-f2fs kmod-igc kmod-r8125 \
        kmod-r8126 kmod-r8168 kmod-usb-net-rtl8152-vendor kmod-vmxnet3 open-vm-tools \
        kmod-ata-piix kmod-scsi-core kmod-mpt3sas kmod-drm-i915; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # 3. 插件与工具 (包含你要求的全部包)
        for app in luci luci-compat luci-i18n-base-zh-cn lucky netbird luci-app-netbird \
        rtp2httpd luci-app-rtp2httpd luci-app-taskplan luci-app-passwall luci-app-ttyd \
        iperf3 tcpdump pv iftop luci-proto-wireguard luci-app-wireguard; do
          echo "CONFIG_PACKAGE_$app=y" >> .config
        done
        
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=800" >> .config
        make defconfig
        make download -j8

    - name: 开始编译
      id: compile
      run: |
        cd openwrt
        # 监控空间
        (while true; do df -h /; sleep 600; done) &
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理并重命名固件
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        V_TAG=$(echo ${{ env.TARGET_BRANCH }} | sed 's/openwrt-//')
        ARCH="x86_64"
        # 导出插件列表
        echo "PLUGINS_LIST<<EOF" >> $GITHUB_ENV
        grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | cut -d'_' -f3- | cut -d'=' -f1 | sed 's/^/- /' >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # 整理输出
        mkdir -p /tmp/upload/
        find bin/targets/x86/64/ -name "*combined-efi.img.gz" -exec cp {} /tmp/upload/immortalwrt-${ARCH}-${V_TAG}-efi.img.gz \;
        find bin/targets/x86/64/ -name "*combined.img.gz" ! -name "*efi*" -exec cp {} /tmp/upload/immortalwrt-${ARCH}-${V_TAG}-legacy.img.gz \;

    - name: 发布到 Release
      if: steps.compile.outputs.status == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: Latest-Release
        release_name: "ImmortalWrt-${{ env.TARGET_BRANCH }}-x86_64"
        body: |
          ### 固件说明
          - **分支**: ${{ env.TARGET_BRANCH }}
          - **特性**: 智能空间挂载 (基于 /mnt)，解决 Netbird 编译空间报错
          - **驱动**: 集成最新官方 open-vm-tools 源码
          
          ### 集成插件:
          ${{ env.PLUGINS_LIST }}
        overwrite: true
        file_glob: true

    - name: 删除旧版
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 0
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

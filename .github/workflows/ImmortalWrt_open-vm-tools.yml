name: Build_ImmortalWrt_V31_Netbird_Binary_Only

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: 极限空间清理
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV

    - name: 更新 Feeds 与源处理
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        
        # 1. 注入源 (只保留你需要的)
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        
        # 2. 核心操作：删除官方可能存在的 netbird 残留，确保只用自定义源
        find feeds/ -name "*netbird*" -type d -exec rm -rf {} + || true
        
        ./scripts/feeds install -a

    - name: 固件配置 (强制选中二进制 Netbird)
      run: |
        cd openwrt
        # 时区设置
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        
        # 基础架构与分区
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config

        # --- 强制选中 Netbird 及其运行必须的内核模块 ---
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        echo "CONFIG_PACKAGE_ca-bundle=y" >> .config

        # 其他你需要的插件
        for app in luci-compat luci-i18n-base-zh-cn luci-app-lucky luci-app-turboacc \
        luci-app-passwall luci-app-ttyd luci-app-netdata wireguard luci-app-wireguard \
        luci-app-upnp iperf3 nano htop; do
          echo "CONFIG_PACKAGE_$app=y" >> .config
        done

        # 写入全量驱动 (保持你的长列表)
        for drv in autocore automount block-mount fdisk fstools grub2-bios-setup mkf2fs mtd partx-utils \
        kmod-e1000e kmod-igc kmod-r8125 kmod-r8126 kmod-r8168 kmod-vmxnet3 kmod-8139cp kmod-8139too \
        kmod-i40e kmod-igb kmod-igbvf kmod-ixgbe kmod-ixgbevf kmod-pcnet32 kmod-r8101 kmod-tulip \
        kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-e1000 kmod-tg3 kmod-forcedeth kmod-dwmac-intel \
        open-vm-tools kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 \
        kmod-usb-net-rtl8152-vendor kmod-usb-hid i915-firmware-dmc kmod-drm-i915 kmod-fs-f2fs \
        kmod-fs-vfat kmod-nf-nathelper kmod-nf-nathelper-extra kmod-nft-offload; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # 关键：先执行 defconfig，然后检查 netbird 是否还在，不在就强制加回
        make defconfig
        if ! grep -q "CONFIG_PACKAGE_netbird=y" .config; then
          echo "Netbird 被剔除，正在强制注入..."
          echo "CONFIG_PACKAGE_netbird=y" >> .config
          # 重新整理依赖，不使用 defconfig 以免再次被刷掉
        fi

        make download -j16

    - name: 编译
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理发布
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        mkdir -p /tmp/upload/
        find bin/targets/x86/64/ -name "*.img.gz" -exec cp {} /tmp/upload/ \;

    - name: Upload Release
      if: steps.compile.outputs.status == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: "Build-${{ github.run_id }}"
        release_name: "ImmortalWrt-Netbird-CLI-Fixed"
        overwrite: true
        file_glob: true

name: Build_ImmortalWrt_x86_Ultimate_With_Web

on:
  workflow_dispatch: # 手动触发编译

env:
  REPO_URL: https://github.com/LIUBANGJIAN/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 赋予 Release 写入权限

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extreme Space Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone and Update Feeds
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 添加第三方源
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git openlist2 https://github.com/sbwml/luci-app-openlist2.git" >> ./feeds.conf.default
        echo "src-git netbird https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        echo "src-git taskplan https://github.com/sirpdboy/luci-app-taskplan.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Generate Config
      run: |
        cd openwrt
        # 基础架构
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # --- 核心：强制开启 LuCI Web 界面 ---
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-base=y" >> .config
        echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        
        # --- 插件集成 ---
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openlist2=y" >> .config
        echo "CONFIG_PACKAGE_open-vm-tools=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frps=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-netdata=y" >> .config
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-taskplan=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-rtp2httpd=y" >> .config
        
        # --- 网络工具 ---
        echo "CONFIG_PACKAGE_iperf3=y" >> .config
        echo "CONFIG_PACKAGE_iftop=y" >> .config
        echo "CONFIG_PACKAGE_tcpdump=y" >> .config
        echo "CONFIG_PACKAGE_pv=y" >> .config
        
        # --- 固件定制 ---
        echo "CONFIG_TARGET_IMAGES_GZ=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_EXT4FS=n" >> .config
        echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=300" >> .config # 插件极多，上调至300M保证稳定
        echo "CONFIG_VMDK_IMAGES=n" >> .config
        echo "CONFIG_DEBUG_INFO=n" >> .config
        
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Build Firmware
      id: compile
      run: |
        cd openwrt
        make tools/install -j$(nproc) || make tools/install -j1 V=s
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
        # Netdata和Go插件较多，建议-j2编译
        make -j2 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Organize Artifacts
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/x86/64/
        mkdir -p /tmp/artifact/
        # 精准拷贝并命名 EFI 版本
        cp *squashfs-combined-efi.img.gz /tmp/artifact/immortalwrt-x86-64-combined-efi.img.gz || true
        # 精准拷贝并命名 Legacy 版本
        cp *squashfs-combined.img.gz /tmp/artifact/immortalwrt-x86-64-combined-legacy.img.gz || true
        # 修正：如果上面两步拷贝了同一个文件（某些源码命名规则不同），清理冗余
        cd /tmp/artifact/
        [ -f immortalwrt-x86-64-combined-legacy.img.gz ] && [ -f immortalwrt-x86-64-combined-efi.img.gz ] && \
        cmp -s immortalwrt-x86-64-combined-legacy.img.gz immortalwrt-x86-64-combined-efi.img.gz && \
        rm -f immortalwrt-x86-64-combined-legacy.img.gz || true
        
        cp .config /tmp/artifact/config.buildinfo || true
        echo "FIRMWARE_PATH=/tmp/artifact" >> $GITHUB_ENV

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: ImmortalWrt_Ultimate_x86_64
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      if: steps.compile.outputs.status == 'success'
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.FIRMWARE_PATH }}/*
        tag: Latest-Release
        release_name: "ImmortalWrt-Ultimate [${{ steps.compile.outputs.release_tag }}]"
        overwrite: true
        file_glob: true

    - name: Remove Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: steps.compile.outputs.status == 'success'
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

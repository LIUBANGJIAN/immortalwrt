name: Build_ImmortalWrt_x86

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LIUBANGJIAN/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        # 1. 极限清理磁盘空间
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/az /usr/share/swift /usr/lib/jvm
        
        # 2. 安装必要依赖
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgpgme11-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone and Update
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        
        # 添加第三方库
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git openlist2 https://github.com/sbwml/luci-app-openlist2.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Configure and Download
      run: |
        cd openwrt
        # 基础配置
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # 插件配置
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openlist2=y" >> .config
        echo "CONFIG_PACKAGE_open-vm-tools=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        
        make defconfig
        make download -j8

    - name: Build Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_x86_64
        path: openwrt/bin/targets/x86/64/*

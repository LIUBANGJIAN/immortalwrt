name: Build_ImmortalWrt_V20_Full_Driver

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 磁盘与环境准备
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV
        sudo -E apt-get update
        sudo -E apt-get -y install build-essential gawk git scons unzip gettext python3
        sudo snap install go --classic

    - name: 更新 Feeds 与集成 TurboACC
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        git clone https://github.com/chenmozhijin/turboacc package/turboacc
        find feeds/packages feeds/luci -name "*netbird*" -o -name "*rtp2httpd*" | xargs rm -rf
        ./scripts/feeds install -a

    - name: 固件底层与时区配置
      run: |
        cd openwrt
        # 强制上海时区
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
        
        # 写入 .config 基础
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=900" >> .config

    - name: 注入全量驱动 (按照你提供的清单补全)
      run: |
        cd openwrt
        # 磁盘与系统工具
        for pkg in autocore automount block-mount fdisk fstools grub2-bios-setup mkf2fs mtd partx-utils; do
          echo "CONFIG_PACKAGE_$pkg=y" >> .config
        done

        # 核心网卡驱动 (Intel/Realtek/AMD/Amazon/VMware)
        for drv in kmod-e1000e kmod-igc kmod-r8125 kmod-r8126 kmod-r8168 kmod-vmxnet3 \
        kmod-8139cp kmod-8139too kmod-i40e kmod-igb kmod-igbvf kmod-ixgbe kmod-ixgbevf \
        kmod-pcnet32 kmod-r8101 kmod-tulip kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 \
        kmod-e1000 kmod-tg3 kmod-forcedeth kmod-dwmac-intel open-vm-tools; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # USB网卡与固件
        for usb in kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 \
        kmod-usb-net-rtl8152-vendor kmod-usb-hid i915-firmware-dmc kmod-drm-i915; do
          echo "CONFIG_PACKAGE_$usb=y" >> .config
        done

        # 文件系统与NAT增强
        for fs in kmod-fs-f2fs kmod-fs-vfat kmod-nf-nathelper kmod-nf-nathelper-extra kmod-nft-offload; do
          echo "CONFIG_PACKAGE_$fs=y" >> .config
        done

    - name: 注入定制插件 (CONFIG_PACKAGE 模式)
      run: |
        cd openwrt
        # 基础组件
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-compat=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config

        # 应用插件清单
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-rtp2httpd=y" >> .config
        echo "CONFIG_PACKAGE_rtp2httpd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frps=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-turboacc-zh-cn=y" >> .config

        # 工具类
        echo "CONFIG_PACKAGE_iperf3=y" >> .config
        echo "CONFIG_PACKAGE_tcpdump=y" >> .config
        echo "CONFIG_PACKAGE_htop=y" >> .config

        make defconfig
        make download -j16

    - name: 编译
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 发布 Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: openwrt/bin/targets/x86/64/*combined*.img.gz
        tag: Latest-Standard-V20
        overwrite: true
        file_glob: true

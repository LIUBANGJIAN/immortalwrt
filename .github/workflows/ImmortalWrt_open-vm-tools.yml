name: Build_ImmortalWrt_Custom_Final

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (例如 openwrt-24.10)'
        required: true
        default: 'openwrt-24.10'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  # 这里可以根据输入动态调整，也可以手动改下面这行
  TARGET_BRANCH: ${{ github.event.inputs.branch }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Space Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source
      run: |
        echo "正在拉取分支: ${{ env.TARGET_BRANCH }}"
        git clone $REPO_URL -b ${{ env.TARGET_BRANCH }} openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        echo "src-git taskplan https://github.com/sirpdboy/luci-app-taskplan.git" >> ./feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Custom Settings (Timezone & Web)
      run: |
        cd openwrt
        # 设置上海时区
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate
        # 强制默认中文
        sed -i 's/auto/zh_cn/g' feeds/luci/modules/luci-base/root/etc/config/luci || true

    - name: Generate Config
      run: |
        cd openwrt
        # 基础架构
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # --- 核心初始化与物理机/虚拟机驱动包 ---
        # 磁盘挂载与引导
        for pkg in autocore automount block-mount fdisk grub2-bios-setup fstools kmod-fs-f2fs kmod-fs-vfat mkf2fs partx-utils; do
          echo "CONFIG_PACKAGE_$pkg=y" >> .config
        done
        
        # 物理机常用网卡驱动 (Realtek, Intel, 万兆等)
        for drv in kmod-8139cp kmod-8139too kmod-e1000 kmod-e1000e kmod-i40e kmod-igb kmod-igbvf kmod-igc kmod-ixgbe kmod-ixgbevf kmod-r8101 kmod-r8125 kmod-r8126 kmod-r8168 kmod-tg3 kmod-bnx2 kmod-forcedeth kmod-amazon-ena kmod-amd-xgbe kmod-dwmac-intel; do
          echo "CONFIG_PACKAGE_$drv=y" >> .config
        done

        # 显卡固件与USB网络
        for extra in i915-firmware-dmc kmod-drm-i915 kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 kmod-usb-net-rtl8152-vendor kmod-usb-hid; do
          echo "CONFIG_PACKAGE_$extra=y" >> .config
        done

        # 虚拟机驱动补丁 (关键)
        echo "CONFIG_PACKAGE_kmod-vmxnet3=y" >> .config
        echo "CONFIG_PACKAGE_kmod-pcnet32=y" >> .config
        echo "CONFIG_PACKAGE_open-vm-tools=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ata-piix=y" >> .config

        # --- LuCI 界面与中文 ---
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        
        # --- 你指定的插件 ---
        echo "CONFIG_PACKAGE_luci-app-filetransfer=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-taskplan=y" >> .config
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        
        # --- 固件细节 ---
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=600" >> .config
        echo "CONFIG_TARGET_IMAGES_GZ=y" >> .config
        
        make defconfig
        make download -j8

    - name: Build Firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize & Rename
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        # 制作 Release 说明
        echo "### 固件版本: ${{ env.TARGET_BRANCH }}" > ../release_notes.md
        echo "#### 已集成物理机+虚拟机全量驱动，支持 ESXi, PVE 及各种工控机。" >> ../release_notes.md
        echo "#### 包含插件：" >> ../release_notes.md
        grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | cut -d'_' -f3- | cut -d'=' -f1 | sed 's/^/- /' >> ../release_notes.md
        
        # 文件重命名
        VERSION_TAG=$(echo ${{ env.TARGET_BRANCH }} | sed 's/openwrt-//')
        cd bin/targets/x86/64/
        mkdir -p /tmp/upload/
        cp *combined-efi.img.gz /tmp/upload/immortalwrt-${VERSION_TAG}-x86-64-efi.img.gz || true
        cp *combined.img.gz /tmp/upload/immortalwrt-${VERSION_TAG}-x86-64-legacy.img.gz || true
        echo "FIRMWARE_PATH=/tmp/upload" >> $GITHUB_ENV

    - name: Remove Old & Upload Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.FIRMWARE_PATH }}/*
        tag: Latest-Release
        release_name: "ImmortalWrt ${{ env.TARGET_BRANCH }} [$(date +'%Y-%m-%d')]"
        body_path: release_notes.md
        overwrite: true
        file_glob: true

    - name: Delete Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 0
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

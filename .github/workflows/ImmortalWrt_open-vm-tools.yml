name: Build_ImmortalWrt_V42_Final_Hope

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Go 1.23
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'

    - name: 极限空间清理
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        mkdir -p $(pwd)/openwrt

    - name: 更新 Feeds (关键：精准覆盖)
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b openwrt-24.10
        
        # 1. 注入你的自定义源
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        
        # 2. 【核心点】绝对不要删除 feeds/packages/lang/golang !!!
        # 我们只删除会产生冲突的具体插件目录，强迫系统从新源下载它们
        rm -rf feeds/packages/net/frp*
        rm -rf feeds/packages/net/netbird*
        
        ./scripts/feeds install -a

    - name: 固件配置 (暴力写入法)
      run: |
        cd openwrt
        # 基础定义
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # 强制选中 Go 语言基础 (地基)
        echo "CONFIG_PACKAGE_golang=y" >> .config
        
        # 强制选中你需要的插件 (必须确保名称和 Makefile 一致)
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frpc=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-frps=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        
        # 补全 TurboACC 的内核依赖 (没有这几个，插件界面出不来)
        echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config

        # 第一次执行，让系统自动补全依赖
        make defconfig
        
        # 第二次暴力检查：如果被系统偷偷改成了 n，强行改回 y
        sed -i 's/is not set/=y/g' .config

        make download -j16

    - name: 编译
      run: |
        cd openwrt
        # 如果编译失败，只打印最后 100 行关键错误，方便定位
        make -j$(nproc) || (make -j1 V=s | tail -n 100 && exit 1)

    - name: 整理发布
      run: |
        cd openwrt
        mkdir -p /tmp/upload/
        find bin/targets/x86/64/ -name "*.img.gz" -exec cp {} /tmp/upload/ \;
        
    - name: Upload Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: "Build-V42-Final"
        release_name: "ImmortalWrt-V42-Success"
        overwrite: true

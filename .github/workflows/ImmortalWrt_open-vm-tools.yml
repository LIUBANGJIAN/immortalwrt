name: ImmortalWrt_open-vm-tools

on:
  push:
    branches:
      - master
  workflow_dispatch:
  release:
      types: [published]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Space cleanup & Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/lib/jvm /etc/mysql /etc/php || true
          sudo -E apt-get update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libboost-dev libboost-system-dev libboost-program-options-dev
          sudo -E apt-get clean

      - name: Update feeds
        run: |
          # 仅保留核心必要的第三方源，避免冲突
          sed -i '1i src-git lucky https://github.com/gdy666/luci-app-lucky' feeds.conf.default
          sed -i '2i src-git small https://github.com/kenzok8/small' feeds.conf.default
          sed -i '3i src-git openlist2 https://github.com/sbwml/luci-app-openlist2' feeds.conf.default
          
          ./scripts/feeds update -a
          # 彻底删除冲突包
          rm -rf feeds/packages/net/{alist,adguardhome,mosdns,xray*,v2ray*,sing*,smartdns}
          rm -rf feeds/packages/lang/golang
          git clone --depth=1 -b 25.x https://github.com/sbwml/packages_lang_golang feeds/packages/lang/golang
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          touch .config
          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          
          # 核心依赖修复：强制选中 boost 所有相关包
          CONFIG_PACKAGE_boost=y
          CONFIG_PACKAGE_boost-system=y
          CONFIG_PACKAGE_boost-program_options=y
          CONFIG_PACKAGE_boost-date_time=y
          CONFIG_PACKAGE_boost-thread=y
          
          # 插件选择
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=y
          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_luci-app-openlist2=y
          CONFIG_PACKAGE_open-vm-tools=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF
          
          # 移除 .config 中可能的重复项并使其生效
          sed -i 's/^[ \t]*//g' .config
          make defconfig

      - name: Pre-compile Boost (Fix trojan-plus error)
        run: |
          # 关键步骤：先单独编译 boost，确保 trojan-plus 能找到库文件
          make package/feeds/packages/boost/compile -j$(nproc) || make package/feeds/packages/boost/compile V=s

      - name: Compile the firmware
        run: |
          # 使用 -i 忽略个别非致命错误，或使用单线程排查
          make -j$(nproc) || make -j1 V=s
        
      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/firmware
          cp -rf $(find ./bin/targets/ -type f -name "*.img.gz" -o -name "*.vmdk") ./artifact/firmware/ || true

      - name: Deliver firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./artifact/firmware/

name: Build_ImmortalWrt_Official_Stable_Final_V3

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择编译分支 (如 openwrt-24.10)'
        required: true
        default: 'openwrt-24.10'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  TARGET_BRANCH: ${{ github.event.inputs.branch }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Space Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone Source
      run: git clone $REPO_URL -b ${{ env.TARGET_BRANCH }} openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        echo "src-git taskplan https://github.com/sirpdboy/luci-app-taskplan.git" >> ./feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Custom Settings (Timezone & Language)
      run: |
        cd openwrt
        sed -i 's/UTC/CST-8/g' package/base-files/files/bin/config_generate
        sed -i "s/timezone='.*'/timezone='CST-8'/g" package/base-files/files/bin/config_generate
        sed -i "s/zonename='.*'/zonename='Asia\/Shanghai'/g" package/base-files/files/bin/config_generate

    - name: Generate Config
      run: |
        cd openwrt
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # --- 物理机+虚拟机全量驱动 ---
        for pkg in autocore automount block-mount fdisk grub2-bios-setup fstools kmod-fs-f2fs kmod-fs-vfat mkf2fs partx-utils \
        kmod-8139cp kmod-8139too kmod-e1000 kmod-e1000e kmod-i40e kmod-igb kmod-igbvf kmod-igc kmod-ixgbe kmod-ixgbevf kmod-r8101 \
        kmod-r8125 kmod-r8126 kmod-r8168 kmod-tg3 kmod-bnx2 kmod-forcedeth kmod-amazon-ena kmod-amd-xgbe kmod-dwmac-intel \
        i915-firmware-dmc kmod-drm-i915 kmod-usb-net kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150 \
        kmod-usb-net-rtl8152-vendor kmod-usb-hid kmod-vmxnet3 kmod-pcnet32 open-vm-tools kmod-ata-piix \
        kmod-scsi-core kmod-mptfusion kmod-mptspi kmod-mpt2sas kmod-mpt3sas; do
          echo "CONFIG_PACKAGE_$pkg=y" >> .config
        done

        # --- 核心插件与补全 (针对你缺失的插件) ---
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        
        # 补全你要求的缺失插件
        echo "CONFIG_PACKAGE_luci-proto-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-taskplan=y" >> .config
        echo "CONFIG_PACKAGE_iperf3=y" >> .config
        echo "CONFIG_PACKAGE_iftop=y" >> .config
        echo "CONFIG_PACKAGE_tcpdump=y" >> .config
        echo "CONFIG_PACKAGE_pv=y" >> .config
        
        # 原有插件
        echo "CONFIG_PACKAGE_luci-app-filetransfer=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-nlbwmon=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-lucky=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
        echo "CONFIG_PACKAGE_netbird=y" >> .config
        
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=600" >> .config
        
        make defconfig
        make download -j8

    - name: Build Firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "COMPILE_TIME=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

    - name: Organize & Rename Artifacts
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        V_TAG=$(echo ${{ env.TARGET_BRANCH }} | sed 's/openwrt-//')
        # 架构信息硬编码为 x86-64
        ARCH="x86_64"
        
        # 1. 提取插件信息
        echo "FIRMWARE_VERSION=$V_TAG" >> $GITHUB_ENV
        echo "PLUGINS_LIST<<EOF" >> $GITHUB_ENV
        grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | cut -d'_' -f3- | cut -d'=' -f1 | sed 's/^/- /' >> $GITHUB_ENV
        grep "CONFIG_PACKAGE_iperf3\|CONFIG_PACKAGE_iftop\|CONFIG_PACKAGE_tcpdump" .config | grep "=y" | cut -d'_' -f3- | cut -d'=' -f1 | sed 's/^/- /' >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # 2. 精准定位输出并重命名 (格式: 架构-版本-类型)
        F_PATH="bin/targets/x86/64"
        mkdir -p /tmp/upload/
        find $F_PATH -name "*combined-efi.img.gz" -exec cp {} /tmp/upload/immortalwrt-${ARCH}-${V_TAG}-efi.img.gz \;
        find $F_PATH -name "*combined.img.gz" ! -name "*efi*" -exec cp {} /tmp/upload/immortalwrt-${ARCH}-${V_TAG}-legacy.img.gz \;

    - name: Remove Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 0
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: Latest-Release
        release_name: "ImmortalWrt-x86_64-${{ env.FIRMWARE_VERSION }}"
        body: |
          ### 编译详情
          - **架构**: x86_64
          - **分支**: ${{ env.TARGET_BRANCH }}
          - **时间**: ${{ env.COMPILE_TIME }}
          
          ### 已集成插件:
          ${{ env.PLUGINS_LIST }}
        overwrite: true
        file_glob: true

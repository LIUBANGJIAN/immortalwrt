name: Build_ImmortalWrt_Final_V13

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译分支'
        required: true
        default: 'openwrt-24.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 极限磁盘搬迁 (解决 Netbird 空间报错)
      run: |
        # 1. 清理根分区空间
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /etc/mysql /etc/php /var/lib/mongodb /usr/share/kotlinc /usr/local/share/edge_driver /usr/local/share/gecko_driver /opt/microsoft/powershell /opt/pipx /usr/share/azure-cli /opt/az /usr/lib/google-cloud-sdk
        sudo docker image prune -a -f
        
        # 2. 核心：将所有重负载目录挂载到 /mnt (大分区)
        # 创建工作目录和 Go 专用缓存目录
        sudo mkdir -p /mnt/openwrt_work /mnt/go_cache /mnt/go_path
        sudo chown $USER:$USER /mnt/openwrt_work /mnt/go_cache /mnt/go_path
        
        # 将当前目录下的 openwrt 路径指向大分区
        mkdir -p $(pwd)/openwrt
        sudo mount --bind /mnt/openwrt_work $(pwd)/openwrt
        
        # 强制设置 Go 环境变量指向大分区
        echo "GOCACHE=/mnt/go_cache" >> $GITHUB_ENV
        echo "GOPATH=/mnt/go_path" >> $GITHUB_ENV
        
        df -h

    - name: 安装最新环境
      run: |
        sudo -E apt-get update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo snap install go --classic

    - name: 克隆源码与源处理
      run: |
        cd openwrt
        git clone https://github.com/immortalwrt/immortalwrt . -b ${{ github.event.inputs.branch }}
        echo "src-git lucky https://github.com/gdy666/luci-app-lucky.git" >> ./feeds.conf.default
        echo "src-git small https://github.com/kenzok8/small.git" >> ./feeds.conf.default
        echo "src-git netbird_custom https://github.com/tbc0309/openwrt-netbird.git" >> ./feeds.conf.default
        echo "src-git rtp2httpd https://github.com/stackia/rtp2httpd.git" >> ./feeds.conf.default
        echo "src-git taskplan https://github.com/sirpdboy/luci-app-taskplan.git" >> ./feeds.conf.default
        
        ./scripts/feeds update -a
        # 强制删除官方同名包
        find feeds/packages feeds/luci -name "*netbird*" -o -name "*rtp2httpd*" | xargs rm -rf
        git clone https://github.com/vmware/open-vm-tools.git package/open-vm-tools-latest
        ./scripts/feeds install -a -f

    - name: 固件配置
      run: |
        cd openwrt
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        # 写入必备包
        for pkg in luci-compat luci-i18n-base-zh-cn block-mount kmod-vmxnet3 open-vm-tools \
        lucky netbird luci-app-netbird rtp2httpd luci-app-rtp2httpd luci-app-taskplan \
        luci-app-passwall iperf3 tcpdump pv; do
          echo "CONFIG_PACKAGE_$pkg=y" >> .config
        done
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=900" >> .config
        make defconfig
        make download -j16

    - name: 编译 (强制 V=s 查看细节)
      id: compile
      run: |
        cd openwrt
        # 开启磁盘监控后台进程
        (while true; do df -h /mnt; sleep 300; done) &
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理并发布到 Release
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        V_TAG=$(echo ${{ github.event.inputs.branch }} | sed 's/openwrt-//')
        mkdir -p /tmp/upload/
        find bin/targets/x86/64/ -name "*combined*.img.gz" -exec cp {} /tmp/upload/ \;
        # 修正文件名，方便识别
        cd /tmp/upload/
        for f in *efi.img.gz; do mv "$f" "immortalwrt-x86_64-${V_TAG}-efi.img.gz" 2>/dev/null || true; done
        for f in *combined.img.gz; do mv "$f" "immortalwrt-x86_64-${V_TAG}-legacy.img.gz" 2>/dev/null || true; done

    - name: Upload Release
      if: steps.compile.outputs.status == 'success'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: /tmp/upload/*
        tag: Latest-Final
        release_name: "ImmortalWrt-x86_64-${{ github.event.inputs.branch }}"
        overwrite: true
        file_glob: true
